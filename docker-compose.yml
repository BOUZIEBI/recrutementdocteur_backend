
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: recrutement_image:v0
    container_name: recrutement_app
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - .:/app

    command: >
      python manage.py runserver 0.0.0.0:8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://recrutement_user:postgres@postgres:5432/recrutement_db
      REDIS_URL: redis://redis:6379/0

    networks:
      - recrutement_network

  postgres:
    image: postgres:16
    container_name: recrutement_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: recrutement_db
      POSTGRES_USER: recrutement_user
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - recrutement_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U recrutement_user -d recrutement_db
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - recrutement_network

  redis:
    image: redis:7-alpine
    container_name: recrutement_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - recrutement_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: recrutement_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: root

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - recrutement_network

volumes:
  recrutement_data:
  redis_data:

networks:
  recrutement_network:
    driver: bridge
